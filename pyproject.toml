[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-ml-toolkit"
version = "0.1.0"
description = "A toolkit for statistical machine learning"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipelines*", "config*"]

[tool.setuptools]
py-modules = ["config", "main"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["outputs", "files"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]